<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym Tracker</title>
<meta name="description" content="Persönlicher Gym Tracker: Trainings, Sätze, Pläne, Statistiken und Orte.">
<meta name="theme-color" content="#0e0e11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app" aria-live="polite"></main>
<div id="restbar" hidden></div>
<nav id="nav">
  <button data-a="go" data-view="home"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg><span id="nav-home">Heute</span></button>
  <button data-a="go" data-view="history"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Verlauf</span></button>
  <button data-a="go" data-view="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Statistik</span></button>
  <button data-a="go" data-view="plans"><svg viewBox="0 0 24 24"><path d="M8 4h8v3H8zM6 6H5v15h14V6h-1M9 12h6M9 16h4"/></svg><span>Pläne</span></button>
  <button data-a="go" data-view="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg><span>Mehr</span></button>
</nav>
<div id="sheet" hidden></div>
<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
